name: Build APK

# Builds a signed release APK on every push to main/master, on manual dispatch and on
# version tags (v*). Tags additionally publish a GitHub Release with the APK attached.
#
# Signing (see keystore/README.md). The keystore and its password are NOT committed; they come
# from repository secrets:
#   * KEYSTORE_B64      = base64 of the .jks/.p12 keystore file        (required for a real key)
#   * KEYSTORE_PASSWORD = keystore password                             (required for a real key)
#   * KEY_ALIAS         = key alias, default "jobbdialer"               (optional)
#   * KEY_PASSWORD      = key password, default = KEYSTORE_PASSWORD     (optional)
# Without KEYSTORE_B64 a fresh clone still builds: a temporary keystore is generated so the
# pipeline can be verified, but such an APK is signed with a throwaway key (every build gets a
# new key, so a later build cannot be installed over it without uninstalling first).
# A local build reads signing.properties instead (storeFile/storePassword/keyAlias/keyPassword).

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed by softprops/action-gh-release to create the Release on tags

env:
  BUILD_TOOLS_VERSION: '35.0.0'
  COMPILE_SDK: '35'
  # SHA-256 fingerprint of the release certificate (lowercase hex, no colons). Public information.
  EXPECTED_CERT_SHA256: '14e0ca9f61e8ee74263217ca95212f59a6be669915d99a88c0060c9e0ca7d9ac'

jobs:
  build:
    name: Assemble signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Static checks (tools/check.sh)
        # Informational: shows XML/resource/javac problems early, never blocks the APK build.
        continue-on-error: true
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_JAR="$sdk/platforms/android-$COMPILE_SDK/android.jar"
          bash tools/check.sh

      - name: Resolve signing configuration
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Read one key from signing.properties (empty string if the file or key is absent).
          prop() { [ -f signing.properties ] && sed -n "s/^$1=//p" signing.properties | head -n1 | tr -d '\r' || true; }

          # Prefer the secret, fall back to signing.properties.
          pick() { if [ -n "$1" ]; then printf '%s' "$1"; else printf '%s' "$2"; fi; }

          mkdir -p "$RUNNER_TEMP/signing"
          temporary_key=no
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            printf '%s' "$SECRET_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/signing/release.jks"
            keystore_file="$RUNNER_TEMP/signing/release.jks"
            keystore_password="$(pick "$SECRET_KEYSTORE_PASSWORD" "$(prop storePassword)")"
            key_alias="$(pick "$SECRET_KEY_ALIAS" "$(prop keyAlias)")"
            key_password="$(pick "$SECRET_KEY_PASSWORD" "$(prop keyPassword)")"
            echo "Using keystore from secret KEYSTORE_B64"
          elif [ -f signing.properties ]; then
            store_file="$(prop storeFile)"
            case "$store_file" in
              /*) keystore_file="$store_file" ;;
              *)  keystore_file="$GITHUB_WORKSPACE/${store_file:-keystore/jobbdialer.jks}" ;;
            esac
            keystore_password="$(pick "$SECRET_KEYSTORE_PASSWORD" "$(prop storePassword)")"
            key_alias="$(pick "$SECRET_KEY_ALIAS" "$(prop keyAlias)")"
            key_password="$(pick "$SECRET_KEY_PASSWORD" "$(prop keyPassword)")"
            echo "Using keystore from signing.properties: $keystore_file"
          else
            # No real key available: generate a throwaway one so the pipeline still produces an
            # installable APK. Add the KEYSTORE_B64 + KEYSTORE_PASSWORD secrets for a stable key.
            temporary_key=yes
            keystore_file="$RUNNER_TEMP/signing/temporary.jks"
            keystore_password="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)"
            key_alias="jobbdialer"
            key_password="$keystore_password"
            keytool -genkeypair -keystore "$keystore_file" -storetype PKCS12 -alias "$key_alias" \
              -keyalg RSA -keysize 2048 -validity 10950 -storepass "$keystore_password" \
              -keypass "$key_password" -dname "CN=Jobbdialer temporary key, O=Jobbdialer, C=SE"
            echo "::warning title=Temporary signing key::No KEYSTORE_B64 secret is set. The APK is signed with a throwaway key generated for this run only; a future build cannot be installed over it without uninstalling first. Add the repository secrets KEYSTORE_B64 and KEYSTORE_PASSWORD (see keystore/README.md)."
          fi
          [ -f "$keystore_file" ] || { echo "::error::Keystore not found: $keystore_file"; exit 1; }
          key_alias="${key_alias:-jobbdialer}"
          key_password="${key_password:-$keystore_password}"
          [ -n "$keystore_password" ] || {
            echo "::error::Missing keystore password (secret KEYSTORE_PASSWORD or storePassword in signing.properties)"
            exit 1
          }
          {
            echo "## Signing"
            if [ "$temporary_key" = yes ]; then
              echo ":warning: **Temporary key** – this APK is signed with a throwaway key generated for this run. Add the secrets \`KEYSTORE_B64\` and \`KEYSTORE_PASSWORD\` for a stable key (see keystore/README.md)."
            else
              echo ":white_check_mark: Signed with the configured release key (alias \`$key_alias\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::add-mask::$keystore_password"
          echo "::add-mask::$key_password"
          {
            echo "KEYSTORE_FILE=$keystore_file"
            echo "KEYSTORE_PASSWORD=$keystore_password"
            echo "KEY_ALIAS=$key_alias"
            echo "KEY_PASSWORD=$key_password"
            echo "TEMPORARY_KEY=$temporary_key"
          } >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: |
          set -euo pipefail
          version="$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)"/\1/' || true)"
          version="${version:-1.0}"
          src="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::$src not found"
            ls -R app/build/outputs || true
            exit 1
          fi
          mv "$src" "app/build/outputs/apk/release/Jobbdialer-v${version}.apk"
          echo "APK_NAME=Jobbdialer-v${version}.apk" >> "$GITHUB_ENV"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Renamed to Jobbdialer-v${version}.apk"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$sdk/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          [ -x "$apksigner" ] || { echo "::error::apksigner not found at $apksigner"; exit 1; }

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK found in app/build/outputs/apk/release/"
            ls -R app/build/outputs || true
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "--- $apk ($(du -h "$apk" | cut -f1))"
            out="$("$apksigner" verify --verbose --print-certs "$apk")"
            printf '%s\n' "$out"
            digest="$(printf '%s\n' "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' | head -n1 | tr -d '[:space:]' | tr 'A-F' 'a-f')"
            [ -n "$digest" ] || { echo "::error::Could not read the signer certificate SHA-256 digest of $apk"; exit 1; }
            if [ "${TEMPORARY_KEY:-no}" = no ]; then
              if [ "$digest" != "$EXPECTED_CERT_SHA256" ]; then
                echo "::error::APK is not signed with the expected release key (got $digest, expected $EXPECTED_CERT_SHA256)"
                exit 1
              fi
              echo "Signed with the expected release key"
              key_note="expected release key"
            else
              echo "::warning::Signed with a temporary key (certificate SHA-256 $digest)"
              key_note="temporary key (not the release key)"
            fi
            {
              echo "### APK certificate"
              echo "- File: \`$(basename "$apk")\`"
              echo "- SHA-256: \`$digest\`"
              echo "- Key: $key_note"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobbdialer-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # A Release gives a stable download link (…/releases/latest) without unzipping artifacts.
      # On pushes to main the release is named after versionName (v1.0, v1.1, …) and its APK is
      # replaced by every build with that version; a pushed tag v* publishes under that tag.
      # Skipped for temporary-key builds so no throwaway-signed APK ends up under Releases.
      - name: Publish GitHub Release
        if: env.TEMPORARY_KEY == 'no' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: Jobbdialer ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          body: |
            Signerad release-APK för sidladdning. Ladda ner `${{ env.APK_NAME }}` nedan och öppna filen på telefonen.
            Byggd från ${{ github.sha }}.
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          make_latest: true
